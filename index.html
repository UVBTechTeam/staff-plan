<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UVB Staff Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<!-- ============================================================
     FIREBASE SETUP — read before deploying
     1. Create a Firebase project at https://console.firebase.google.com
     2. Enable "Realtime Database" (start in locked mode).
     3. Enable "Authentication" > Sign-in method > Email/Password.
     4. In Authentication > Users, manually add an account for each
        person who needs access (name + password). There is no public
        sign-up screen in this app on purpose — accounts are created
        by an admin in the Firebase console.
     5. In Realtime Database > Rules, set:
        {
          "rules": {
            ".read": "auth != null",
            ".write": "auth != null"
          }
        }
        This keeps the data locked to signed-in UVB accounts only —
        the page itself can be public on GitHub Pages, but no data
        will load or save without a login.
     6. Copy your Firebase config (Project settings > General >
        Your apps > SDK setup and configuration) into firebaseConfig
        below.
     ============================================================ -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
  :root{
    --bg:#15171B;
    --panel:#1E2127;
    --panel-alt:#23262D;
    --border:#2C3038;
    --border-soft:#33373F;
    --text:#E8EAED;
    --text-muted:#868C96;
    --text-faint:#5B6069;
    --amber:#F2A93B;
    --amber-dim:#8A6420;
    --cyan:#3FB8C4;
    --danger:#E0575B;
    --danger-dim:#5A2A2C;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--amber);color:#15171B;}

  /* ---------- utility ---------- */
  .mono{font-family:'JetBrains Mono',monospace;letter-spacing:0.02em;}
  .hidden{display:none !important;}
  button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:1px solid var(--border-soft);
    background:var(--panel-alt);
    color:var(--text);
    border-radius:var(--radius);
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  button:hover{border-color:var(--amber);color:var(--amber);}
  button:active{transform:translateY(1px);}
  button.primary{background:var(--amber);color:#15171B;border-color:var(--amber);}
  button.primary:hover{background:#ffc266;color:#15171B;}
  button.ghost{background:transparent;}
  button.icon{padding:4px 8px;font-size:12px;line-height:1;}
  button.danger-hover:hover{border-color:var(--danger);color:var(--danger);}
  input[type=text], input[type=date], input[type=email], input[type=password], select, textarea{
    background:var(--bg);
    border:1px solid var(--border-soft);
    color:var(--text);
    border-radius:var(--radius);
    padding:7px 9px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    outline:none;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--amber);}
  input::placeholder{color:var(--text-faint);}

  /* ---------- login ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
  }
  #loginScreen .brand{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:34px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--text);
  }
  #loginScreen .brand span{color:var(--amber);}
  #loginScreen .sub{
    color:var(--text-muted);
    font-size:13px;
    margin-top:-14px;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:0.05em;
  }
  #loginBox{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px;
    width:280px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  #loginBox label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:-4px;}
  #loginError{color:var(--danger);font-size:12px;min-height:16px;}

  /* ---------- app shell ---------- */
  #app{display:none;min-height:100vh;flex-direction:column;}
  header.topbar{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .brandmark{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brandmark .dot{width:8px;height:8px;background:var(--amber);border-radius:50%;display:inline-block;}
  .brandmark span.accent{color:var(--amber);}

  .dateNav{display:flex;align-items:center;gap:8px;}
  .dateNav .datebig{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--text);
    background:var(--panel-alt);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:7px 10px;
  }

  .topActions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  main{flex:1;padding:22px;}
  #roomGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
    gap:18px;
  }

  /* ---------- room card ---------- */
  .roomCard{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    position:relative;
    padding-top:14px;
    display:flex;
    flex-direction:column;
    overflow:visible;
  }
  .roomHead{
    padding:0 14px 10px 14px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    border-bottom:1px dashed var(--border-soft);
    margin-bottom:10px;
  }
  .roomTitle{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:19px;
    text-transform:uppercase;
    letter-spacing:0.02em;
    line-height:1.15;
  }
  .roomCode{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--text-faint);
    letter-spacing:0.08em;
    display:block;
    margin-top:2px;
  }
  .eventTab{
    position:absolute;
    top:-10px;
    right:14px;
    background:var(--amber);
    color:#15171B;
    font-family:'JetBrains Mono',monospace;
    font-weight:600;
    font-size:11px;
    padding:4px 10px;
    border-radius:2px;
    transform:rotate(-1.2deg);
    box-shadow:0 2px 4px rgba(0,0,0,.35);
    cursor:pointer;
    max-width:70%;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .eventTab.empty{
    background:var(--panel-alt);
    color:var(--text-faint);
    border:1px dashed var(--border-soft);
  }
  .eventInput{
    position:absolute;
    top:-11px;
    right:14px;
    width:70%;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:4px 8px;
    z-index:5;
  }

  .assignList{display:flex;flex-direction:column;gap:8px;padding:0 14px;}
  .assignRow{
    background:var(--panel-alt);
    border:1px solid var(--border-soft);
    border-left:3px solid var(--cyan);
    border-radius:var(--radius);
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .assignRow.isFreelancer{border-left-color:var(--amber);}
  .assignRowTop{display:flex;gap:6px;align-items:center;}
  .assignRowTop select{flex:1;min-width:0;}
  .assignRow input.notes{width:100%;}
  .assignRow input.freelancerName{width:100%;border-color:var(--amber-dim);}
  .rowRemove{
    background:transparent;border:1px solid var(--border-soft);color:var(--text-faint);
    padding:5px 8px;font-size:12px;line-height:1;flex-shrink:0;
  }
  .rowRemove:hover{border-color:var(--danger);color:var(--danger);}

  .cardFooter{padding:10px 14px 14px 14px;margin-top:auto;}
  .addStaffBtn{width:100%;border-style:dashed;font-weight:600;}
  .noAssign{color:var(--text-faint);font-size:12px;font-style:italic;padding:6px 0;}

  /* ---------- modals ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,11,13,.7);
    display:none;align-items:center;justify-content:center;z-index:100;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    width:100%;max-width:420px;
    max-height:85vh;
    display:flex;flex-direction:column;
  }
  .modalHead{
    padding:16px 18px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .modalHead h3{
    margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:19px;text-transform:uppercase;letter-spacing:0.03em;
  }
  .modalBody{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
  .modalFooter{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;}
  .listRow{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--panel-alt);border:1px solid var(--border-soft);
    border-radius:var(--radius);padding:7px 10px;font-size:13px;
  }
  .addRow{display:flex;gap:8px;}
  .addRow input{flex:1;}
  .closeX{background:transparent;border:none;color:var(--text-muted);font-size:18px;padding:0 4px;}
  .closeX:hover{color:var(--danger);border:none;}

  footer.roomAdd{
    padding:0 22px 30px 22px;
  }

  .emptyState{
    color:var(--text-faint);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    padding:40px 0;
    text-align:center;
  }

  @media (max-width:640px){
    header.topbar{padding:12px 14px;}
    main{padding:14px;}
    .topActions button{font-size:12px;padding:7px 10px;}
  }
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="loginScreen">
  <div class="brand">UVB <span>STAFF PLAN</span></div>
  <div class="sub">SIGN IN TO CONTINUE</div>
  <div id="loginBox">
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="you@uvb.co.uk" autocomplete="username">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    <div id="loginError"></div>
    <button class="primary" id="loginBtn" style="margin-top:6px;">Sign In</button>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app">
  <header class="topbar">
    <div class="brandmark"><span class="dot"></span>UVB <span class="accent">STAFF&nbsp;PLAN</span></div>

    <div class="dateNav">
      <button class="icon" id="prevDay">◀</button>
      <input type="date" id="datePicker" class="datebig">
      <button class="icon" id="nextDay">▶</button>
      <button id="todayBtn">Today</button>
    </div>

    <div class="topActions">
      <button id="manageStaffBtn">Staff</button>
      <button id="manageRolesBtn">Job Roles</button>
      <button id="addRoomBtn">+ Room</button>
      <button class="primary" id="exportPdfBtn">Export PDF</button>
      <button class="ghost" id="signOutBtn">Sign Out</button>
    </div>
  </header>

  <main>
    <div id="roomGrid"></div>
  </main>
</div>

<!-- ==================== MODALS ==================== -->
<div class="overlay" id="staffModal">
  <div class="modal">
    <div class="modalHead"><h3>Staff</h3><button class="closeX" data-close="staffModal">✕</button></div>
    <div class="modalBody">
      <div class="addRow">
        <input type="text" id="newStaffName" placeholder="Add staff name…">
        <button class="primary" id="addStaffConfirm">Add</button>
      </div>
      <div id="staffList"></div>
    </div>
  </div>
</div>

<div class="overlay" id="rolesModal">
  <div class="modal">
    <div class="modalHead"><h3>Job Roles</h3><button class="closeX" data-close="rolesModal">✕</button></div>
    <div class="modalBody">
      <div class="addRow">
        <input type="text" id="newRoleName" placeholder="Add job title…">
        <button class="primary" id="addRoleConfirm">Add</button>
      </div>
      <div id="rolesList"></div>
    </div>
  </div>
</div>

<div class="overlay" id="roomModal">
  <div class="modal">
    <div class="modalHead"><h3>Rooms</h3><button class="closeX" data-close="roomModal">✕</button></div>
    <div class="modalBody">
      <div class="addRow">
        <input type="text" id="newRoomName" placeholder="Add room / space name…">
        <button class="primary" id="addRoomConfirm">Add</button>
      </div>
      <div id="roomsList"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   FIREBASE CONFIG — paste your project's config here
   ========================================================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* =========================================================
   SEED DATA — only written once, if the DB is empty
   ========================================================= */
const SEED_STAFF = ["Jabari Douglas","Matt Spiers","Alastair Willimott","Levi Simpson","Tori Bukle","Jamie Dickinson","Anders Berry","Jake Cureton","Freelancer"];
const SEED_ROLES = ["Duty Technician","Production Manager","Production Assistant","Lighting Engineer","Sound Engineer","Graphics Technician","Audio No. 2","Crew","General Technician"];
const SEED_ROOMS = ["The House","The Studio","The Door","The Meeting Rooms","Meeting Room 1 & 2","Meeting Room 2 & 3","Meeting Room 1","Meeting Room 2","Meeting 3","LOB 101","LOB 102","LOB 103","LOB 105","Library Mezzanine","Book Rotunda","Level 2 Feature Space"];

function seedIfEmpty(path, items){
  db.ref(path).once('value').then(snap=>{
    if(!snap.exists()){
      let updates = {};
      items.forEach((name,i)=>{
        const id = db.ref(path).push().key;
        updates[id] = { name, order: i };
      });
      db.ref(path).set(updates);
    }
  });
}

/* =========================================================
   STATE
   ========================================================= */
let currentDate = fmtDate(new Date());
let staff = {};      // id -> {name, order}
let roles = {};       // id -> {name, order}
let rooms = {};       // id -> {name, order}
let daySchedule = {}; // roomId -> {event, assignments:{id:{staffId, freelancerName, roleId, notes}}}
let scheduleRef = null;

function fmtDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function prettyDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

/* =========================================================
   AUTH
   ========================================================= */
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  auth.signInWithEmailAndPassword(email, pw).catch(err=>{
    errEl.textContent = 'Sign in failed — check email and password.';
    console.error(err);
  });
}
document.getElementById('signOutBtn').addEventListener('click', ()=> auth.signOut());

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='flex';
    initApp();
  } else {
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('app').style.display='none';
  }
});

/* =========================================================
   INIT / LISTENERS
   ========================================================= */
let initialised = false;
function initApp(){
  document.getElementById('datePicker').value = currentDate;

  if(initialised) return;
  initialised = true;

  seedIfEmpty('staff', SEED_STAFF);
  seedIfEmpty('jobRoles', SEED_ROLES);
  seedIfEmpty('rooms', SEED_ROOMS);

  db.ref('staff').on('value', snap=>{ staff = snap.val() || {}; renderStaffList(); renderRoomGrid(); });
  db.ref('jobRoles').on('value', snap=>{ roles = snap.val() || {}; renderRolesList(); renderRoomGrid(); });
  db.ref('rooms').on('value', snap=>{ rooms = snap.val() || {}; renderRoomsList(); renderRoomGrid(); });

  watchDate(currentDate);

  document.getElementById('datePicker').addEventListener('change', e=>{
    currentDate = e.target.value;
    watchDate(currentDate);
  });
  document.getElementById('prevDay').addEventListener('click', ()=> shiftDate(-1));
  document.getElementById('nextDay').addEventListener('click', ()=> shiftDate(1));
  document.getElementById('todayBtn').addEventListener('click', ()=>{
    currentDate = fmtDate(new Date());
    document.getElementById('datePicker').value = currentDate;
    watchDate(currentDate);
  });
}

function shiftDate(deltaDays){
  const d = new Date(currentDate + 'T00:00:00');
  d.setDate(d.getDate()+deltaDays);
  currentDate = fmtDate(d);
  document.getElementById('datePicker').value = currentDate;
  watchDate(currentDate);
}

function watchDate(dateStr){
  if(scheduleRef) scheduleRef.off();
  scheduleRef = db.ref('schedule/' + dateStr);
  scheduleRef.on('value', snap=>{
    daySchedule = snap.val() || {};
    renderRoomGrid();
  });
}

/* =========================================================
   ORDERED HELPERS
   ========================================================= */
function orderedEntries(obj){
  return Object.entries(obj || {}).sort((a,b)=> (a[1].order??0) - (b[1].order??0));
}
function nextOrder(obj){
  const vals = Object.values(obj||{}).map(v=>v.order??0);
  return vals.length ? Math.max(...vals)+1 : 0;
}
function isFreelancerStaff(staffId){
  const s = staff[staffId];
  return s && s.name.trim().toLowerCase() === 'freelancer';
}

/* =========================================================
   RENDER: ROOM GRID
   ========================================================= */
function renderRoomGrid(){
  const grid = document.getElementById('roomGrid');
  grid.innerHTML = '';
  const roomEntries = orderedEntries(rooms);

  if(roomEntries.length === 0){
    grid.innerHTML = '<div class="emptyState">No rooms yet — add one with the "+ Room" button.</div>';
    return;
  }

  roomEntries.forEach(([roomId, roomData])=>{
    const roomDay = daySchedule[roomId] || {};
    const event = roomDay.event || '';
    const assignments = roomDay.assignments || {};

    const card = document.createElement('div');
    card.className = 'roomCard';

    // event tab
    const tab = document.createElement('div');
    tab.className = 'eventTab' + (event ? '' : ' empty');
    tab.textContent = event || '+ Add event';
    tab.title = 'Click to edit event name';
    tab.addEventListener('click', ()=> editEventTab(card, roomId, event));
    card.appendChild(tab);

    // head
    const head = document.createElement('div');
    head.className = 'roomHead';
    head.innerHTML = `<div><div class="roomTitle">${escapeHtml(roomData.name)}</div><span class="roomCode mono">ROOM · ${escapeHtml(roomData.name).toUpperCase()}</span></div>`;
    card.appendChild(head);

    // assignments
    const list = document.createElement('div');
    list.className = 'assignList';
    const assignEntries = orderedEntries(assignments);
    if(assignEntries.length === 0){
      const none = document.createElement('div');
      none.className = 'noAssign';
      none.textContent = 'No staff assigned yet.';
      list.appendChild(none);
    } else {
      assignEntries.forEach(([assignId, a])=>{
        list.appendChild(renderAssignRow(roomId, assignId, a));
      });
    }
    card.appendChild(list);

    // footer / add staff
    const footer = document.createElement('div');
    footer.className = 'cardFooter';
    const addBtn = document.createElement('button');
    addBtn.className = 'addStaffBtn';
    addBtn.textContent = '+ Add Staff to this Room';
    addBtn.addEventListener('click', ()=> addAssignment(roomId));
    footer.appendChild(addBtn);
    card.appendChild(footer);

    grid.appendChild(card);
  });
}

function renderAssignRow(roomId, assignId, a){
  const row = document.createElement('div');
  const freelancer = isFreelancerStaff(a.staffId);
  row.className = 'assignRow' + (freelancer ? ' isFreelancer' : '');

  const top = document.createElement('div');
  top.className = 'assignRowTop';

  // staff select
  const staffSel = document.createElement('select');
  staffSel.innerHTML = '<option value="">Select staff…</option>' +
    orderedEntries(staff).map(([id,s])=>`<option value="${id}" ${id===a.staffId?'selected':''}>${escapeHtml(s.name)}</option>`).join('');
  staffSel.addEventListener('change', ()=>{
    updateAssignment(roomId, assignId, { staffId: staffSel.value });
  });
  top.appendChild(staffSel);

  // role select
  const roleSel = document.createElement('select');
  roleSel.innerHTML = '<option value="">Role…</option>' +
    orderedEntries(roles).map(([id,r])=>`<option value="${id}" ${id===a.roleId?'selected':''}>${escapeHtml(r.name)}</option>`).join('');
  roleSel.addEventListener('change', ()=>{
    updateAssignment(roomId, assignId, { roleId: roleSel.value });
  });
  top.appendChild(roleSel);

  const rm = document.createElement('button');
  rm.className = 'rowRemove';
  rm.textContent = '✕';
  rm.title = 'Remove';
  rm.addEventListener('click', ()=> removeAssignment(roomId, assignId));
  top.appendChild(rm);

  row.appendChild(top);

  if(freelancer){
    const fnInput = document.createElement('input');
    fnInput.type = 'text';
    fnInput.className = 'freelancerName';
    fnInput.placeholder = 'Freelancer name…';
    fnInput.value = a.freelancerName || '';
    fnInput.addEventListener('blur', ()=> updateAssignment(roomId, assignId, { freelancerName: fnInput.value }));
    row.appendChild(fnInput);
  }

  const notesInput = document.createElement('input');
  notesInput.type = 'text';
  notesInput.className = 'notes';
  notesInput.placeholder = 'Notes — what they\'re doing…';
  notesInput.value = a.notes || '';
  notesInput.addEventListener('blur', ()=> updateAssignment(roomId, assignId, { notes: notesInput.value }));
  row.appendChild(notesInput);

  return row;
}

function editEventTab(card, roomId, currentEvent){
  const existingTab = card.querySelector('.eventTab');
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'eventInput';
  input.value = currentEvent;
  input.placeholder = 'Event name…';
  existingTab.replaceWith(input);
  input.focus();
  input.select();
  const commit = ()=>{
    db.ref(`schedule/${currentDate}/${roomId}/event`).set(input.value.trim());
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') input.blur(); });
}

/* =========================================================
   WRITE HELPERS: assignments
   ========================================================= */
function addAssignment(roomId){
  const ref = db.ref(`schedule/${currentDate}/${roomId}/assignments`).push();
  const order = nextOrder((daySchedule[roomId]||{}).assignments);
  ref.set({ staffId:'', roleId:'', freelancerName:'', notes:'', order });
}
function updateAssignment(roomId, assignId, patch){
  db.ref(`schedule/${currentDate}/${roomId}/assignments/${assignId}`).update(patch);
}
function removeAssignment(roomId, assignId){
  db.ref(`schedule/${currentDate}/${roomId}/assignments/${assignId}`).remove();
}

/* =========================================================
   PDF EXPORT
   ========================================================= */
document.getElementById('exportPdfBtn').addEventListener('click', exportPdf);

function exportPdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const margin = 40;
  let y = 50;

  doc.setFont('helvetica','bold');
  doc.setFontSize(18);
  doc.setTextColor(20,20,20);
  doc.text('UVB Staff Plan', margin, y);

  doc.setFont('helvetica','normal');
  doc.setFontSize(11);
  doc.setTextColor(90,90,90);
  y += 18;
  doc.text(prettyDate(currentDate), margin, y);

  y += 22;

  const roomEntries = orderedEntries(rooms);
  let anyContent = false;

  roomEntries.forEach(([roomId, roomData])=>{
    const roomDay = daySchedule[roomId] || {};
    const event = roomDay.event || '';
    const assignEntries = orderedEntries(roomDay.assignments || {})
      .filter(([, a]) => a.staffId); // skip fully-empty rows

    if(!event && assignEntries.length === 0) return; // skip unscheduled rooms
    anyContent = true;

    if(y > 740){ doc.addPage(); y = 50; }

    doc.setFont('helvetica','bold');
    doc.setFontSize(13);
    doc.setTextColor(20,20,20);
    doc.text(roomData.name, margin, y);

    if(event){
      doc.setFont('helvetica','italic');
      doc.setFontSize(10.5);
      doc.setTextColor(120,90,20);
      doc.text(event, margin, y + 14);
      y += 14;
    }

    const rows = assignEntries.length
      ? assignEntries.map(([, a])=>{
          const s = staff[a.staffId];
          let name = s ? s.name : '—';
          if(s && s.name.trim().toLowerCase()==='freelancer'){
            name = 'Freelancer' + (a.freelancerName ? ' — ' + a.freelancerName : ' (unnamed)');
          }
          const roleName = roles[a.roleId] ? roles[a.roleId].name : '—';
          return [name, roleName, a.notes || ''];
        })
      : [['No staff assigned yet.', '', '']];

    doc.autoTable({
      startY: y + 8,
      margin: { left: margin, right: margin },
      head: [['Staff', 'Role', 'Notes']],
      body: rows,
      styles: { font:'helvetica', fontSize:9.5, cellPadding:5, textColor:[30,30,30], lineColor:[210,210,210] },
      headStyles: { fillColor:[30,32,38], textColor:[240,240,240], fontStyle:'bold' },
      alternateRowStyles: { fillColor:[247,247,247] },
      columnStyles: { 0:{cellWidth:150}, 1:{cellWidth:120}, 2:{cellWidth:'auto'} },
    });

    y = doc.lastAutoTable.finalY + 26;
  });

  if(!anyContent){
    doc.setFont('helvetica','normal');
    doc.setFontSize(11);
    doc.setTextColor(120,120,120);
    doc.text('No rooms scheduled for this date.', margin, y);
  }

  doc.save(`UVB-Staff-Plan-${currentDate}.pdf`);
}

/* =========================================================
   UTIL
   ========================================================= */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
